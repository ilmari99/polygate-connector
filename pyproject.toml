[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polygate-connector"
version = "0.2.4"
description = "A read-only MCP server for researching Polymarket prediction-market data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.137",
    "uvicorn[standard]>=0.49",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "tenacity>=9.1",
    "slowapi>=0.1.9",
    "mcp>=1.27,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "respx>=0.23",
]

[project.scripts]
polygate-connector = "polygate_connector.serve:run"
polygate-connector-stdio = "polygate_connector.mcp_server:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
polygate_connector = ["data_model.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
